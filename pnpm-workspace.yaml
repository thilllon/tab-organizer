allowBuilds:
  esbuild: true
# Minutes. Only versions published at least 7 days ago are installed: a hijacked release is
# usually caught and unpublished within days. pnpm's own default is 1 day.
minimumReleaseAge: 10080
# Already in the lockfile when the 7-day rule was introduced (2026-10-04) and not yet a week
# old. Every entry is past the cutoff by 2026-10-11 — delete this whole list then.
