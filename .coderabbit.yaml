# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: Be concise and actionable. Prioritize concrete correctness, security, and compatibility issues; avoid repeating feedback already covered by CI.
reviews:
  profile: chill
  high_level_summary_in_walkthrough: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    # The default branch (main) is reviewed without adding other targets.
    base_branches: []
  path_filters:
    - "!dist/**"
    - "!package/**"
    - "!screenshots/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "src/service-worker.ts"
      instructions: >-
        Manifest V3 service worker. Flag any chrome.tabs/chrome.windows/chrome.tabGroups event
        listener (forbidden here), listeners registered after an await, module-scope mutable
        state relied on between events, and any chrome namespace used at module-evaluation
        time without a matching manifest permission in the same PR.
    - path: "src/lib/**"
      instructions: >-
        Session data must go through sessionRepo under the Web Lock (never raw
        chrome.storage), never into chrome.storage.sync, and never persist Chrome runtime ids
        (tab/window/group ids). Restore code must sanitise URLs before opening them.
    - path: "src/{pages,components,hooks}/**"
      instructions: >-
        Extension page React code. Flag network requests of any kind (only
        chrome.runtime.getURL('/_favicon/…') images are allowed), dangerouslySetInnerHTML,
        missing effect cleanup, and unguarded async races (this codebase uses generation
        counters).
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
