name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  ci:
    runs-on: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the gitleaks scan below.
          fetch-depth: 0

      - uses: jdx/mise-action@v5.1.2

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          STORE_PATH=$(pnpm store path)
          echo "📦 pnpm store path: $STORE_PATH"
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      # Every commit, not only this push: a secret is leaked once it is in any commit (config: .gitleaks.toml).
      - name: Secret scan (gitleaks)
        run: gitleaks git --redact --no-banner --verbose

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm build

      # The project website (site/, deployed by pages.yml). Built here too so a pull request
      # that breaks it fails before it reaches main.
      - run: pnpm site:build

      # `pnpm build` must emit the extension's one page. It is a rollup input, so a config edit that
      # drops it is a silent, shippable break.
      - name: Verify the build emitted the extension page
        run: |
          test -f dist/app.html || { echo "::error::dist/app.html missing from the build"; exit 1; }
          echo "ok: dist/app.html"

      # The real-Chrome smoke test (scripts/e2e/smoke.ts). Advisory and off the pull-request path
      # on purpose:
      #  - it needs a Chromium that ubuntu-latest does not ship, so every run would pay ~1-2 min
      #    for `playwright install --with-deps chromium` (a ~170 MB download plus apt packages) on
      #    top of the ~35 s run itself. That is a poor trade on every PR push for a check the unit
      #    suite already covers in shape.
      #  - `continue-on-error` keeps a runner-image or browser-download change from turning CI red
      #    for a reason unrelated to the diff. The step still shows up as failed in the run, which
      #    is what stops the script rotting unnoticed - the point of wiring it up at all.
      # Revisit both decisions once the runner image is pinned and a Chromium is cached.
      - name: Install Chromium for the QA smoke test
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: QA smoke test (advisory)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: pnpm e2e:smoke
