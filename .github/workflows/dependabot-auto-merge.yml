name: Dependabot auto-merge

# Auto-merge is opt-in per pull request, and Dependabot never opts its own in. This turns it on
# for minor and patch updates; GitHub then merges the PR once the required `ci` check passes
# (branch protection on main). Major updates are left for a person to read and merge.

on:
  pull_request:
    branches: ["main"]

# Dependabot-triggered runs get a read-only token unless the workflow asks for more.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Both the PR's author and whoever caused this run: a commit a person pushes onto a
    # Dependabot branch must not ride along on the bot's auto-merge.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["ubuntu-latest"]
    steps:
      - name: Read what the PR updates
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for minor and patch updates
        # An allow-list, so an update the metadata step cannot classify is left for a person.
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why everything else waits for a person
        # The exact negation of the step above. --edit-last rewrites this workflow's earlier
        # comment, so a Dependabot rebase does not post the note again.
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-minor' &&
          steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: gh pr comment "$PR_URL" --edit-last --create-if-none --body "$BODY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |-
            **Not auto-merged** — this is a `${{ steps.metadata.outputs.update-type || 'unclassified' }}` update.

            Only minor and patch updates merge themselves. An admin has to read the changelog
            for breaking changes, check that `ci` is green, and merge this PR by hand.
