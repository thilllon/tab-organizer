# gitleaks: secret scanning for commits (lefthook pre-commit) and the whole history (CI).
# The default rule set, minus generated output that cannot hold a hand-written secret.
title = "tabinet"

[extend]
useDefault = true

[[allowlists]]
description = "Generated output: build, store packages, screenshots, lockfile"
paths = ['''^dist/''', '''^release/''', '''^assets/''', '''^pnpm-lock\.yaml$''']
